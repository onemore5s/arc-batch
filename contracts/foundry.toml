[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
allow_paths = ["../node_modules"]
remappings = ["@openzeppelin/=lib/openzeppelin/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 32
